<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스킬투머니 실습실 · 5장</title>

  <!-- Pyodide: 브라우저 내 파이썬 런타임 -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

  <style>
    /* --------------------------------------------------
       CSS RESET & VARIABLES (1장~4장 테마 계승)
    -------------------------------------------------- */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-main: #070d1e;
      --bg-darker: #040814;
      --bg-card: rgba(16, 29, 63, 0.75);
      --bg-card-hover: rgba(23, 41, 88, 0.9);
      --bg-glass: rgba(14, 25, 54, 0.75);
      --border-subtle: rgba(212, 175, 55, 0.2);
      --border-glow: rgba(245, 208, 93, 0.45);

      /* Gold Palette */
      --gold-primary: #f5d061;
      --gold-light: #fff2b2;
      --gold-dark: #b8860b;
      --gold-gradient: linear-gradient(135deg, #fff3b0 0%, #f7d070 25%, #e5a93b 65%, #c8881d 100%);
      --gold-gradient-hover: linear-gradient(135deg, #ffffff 0%, #fce28b 30%, #f3ba49 70%, #d49524 100%);
      --gold-glow: 0 0 25px rgba(245, 208, 97, 0.35);

      /* Navy Palette */
      --navy-900: #070d1e;
      --navy-800: #0d1733;
      --navy-700: #14224b;
      --navy-600: #1d3066;
      --navy-500: #294285;

      /* Text Colors */
      --text-white: #ffffff;
      --text-light: #e4e9f5;
      --text-muted: #95a3c3;
      --text-dim: #67789f;

      /* Editor Colors */
      --editor-bg: #090e1c;
      --editor-gutter: #050813;
      --editor-border: rgba(212, 175, 55, 0.25);
      --editor-line-num: #516287;

      /* Fonts */
      --font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

    body {
      background-color: var(--bg-main);
      color: var(--text-light);
      font-family: var(--font-family);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 20% 0%, rgba(30, 58, 122, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(13, 23, 51, 0.9) 0%, transparent 60%);
      background-attachment: fixed;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      background: none;
    }

    /* --------------------------------------------------
       TOP BANNER: 스킬투머니 실습실 · 5장
    -------------------------------------------------- */
    .lab-top-banner {
      background: linear-gradient(90deg, #070d1e 0%, #101c3d 50%, #070d1e 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);

    .banner-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .banner-home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .banner-home-link:hover {

      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    .banner-title-wrap {

      align-items: center;
      gap: 10px;

    .banner-badge {

      align-items: center;

      background: rgba(245, 208, 97, 0.12);
      border: 1px solid rgba(245, 208, 97, 0.35);
      color: var(--gold-primary);
      font-size: 0.775rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 50px;
      letter-spacing: 0.02em;
    }

    .banner-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .gold-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      font-weight: 800;

    .banner-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);

    .banner-right {

      align-items: center;

      color: var(--text-muted);

    .live-dot {

      height: 8px;
      border-radius: 50%;

      display: inline-block;

    /* --------------------------------------------------
       MAIN SPLIT CONTAINER (좌우 2분할)
    -------------------------------------------------- */
    .lab-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      align-items: start;
    }

    .panel-card {
      background: rgba(14, 25, 54, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 16px 22px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      background: rgba(7, 13, 30, 0.85);

    .panel-header-title {

    .panel-header-icon {

      align-items: center;

    .panel-header-tag {

      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-weight: 600;
    }

    .python-badge {
      background: rgba(46, 81, 162, 0.3);
      border: 1px solid rgba(46, 81, 162, 0.6);
      color: #93c5fd;
    }

    .panel-body {
      padding: 24px;

    /* --------------------------------------------------
       LEFT PANEL: 원데이 강좌 목록 화면 (5장)
    -------------------------------------------------- */

      padding-bottom: 16px;
      margin-bottom: 16px;

    }

    .preview-title-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .preview-title {
      font-size: 1.65rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .preview-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-refresh-list {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(245, 208, 97, 0.15), rgba(46, 81, 162, 0.25));
      border: 1px solid var(--border-glow);
      color: var(--gold-primary);

      font-weight: 700;

      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);

    .btn-refresh-list:hover {

    .btn-refresh-list:active {
      transform: translateY(0);

    /* 5장 요구사항: "예약 가능한 강좌만 보기" 체크 상자 (직접 누를 수 없게) */
    .filter-ctrl-bar {
      background: rgba(7, 13, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-checkbox-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      cursor: not-allowed;
      user-select: none;
      opacity: 0.9;
    }

    .filter-checkbox-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--gold-primary);
      cursor: not-allowed;
    }

    .filter-hint-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(245, 208, 97, 0.12);
      border: 1px solid rgba(245, 208, 97, 0.3);
      color: var(--gold-primary);
      font-weight: 600;
    }

    /* 강좌 카드가 쌓이는 자리 */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 250px;
    }

    /* 강좌 카드 스타일 */
    .course-card-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px 22px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .course-card-item:hover {
      border-color: var(--gold-primary);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(245, 208, 97, 0.18);
    }

    .course-card-item.is-closed {
      border-color: rgba(148, 163, 184, 0.25);
      background: rgba(10, 18, 38, 0.85);
      opacity: 0.92;
    }

    .card-top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      font-size: 1.7rem;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }

    /* 요구사항: 줄의 맨 앞 강좌 이름은 굵게 */
    .card-course-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    /* 태그 배지 목록 */
    .card-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .card-tag-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(7, 13, 30, 0.8);
      border: 1px solid rgba(245, 208, 97, 0.3);
      color: var(--gold-primary);
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* 상태 배지 */
    .badge-closed {
      background: rgba(148, 163, 184, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.45);
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: -0.01em;
    }

    .badge-urgent {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #ef4444;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: -0.01em;
      animation: pulseUrgent 1.8s infinite;
    }

    @keyframes pulseUrgent {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(0.98); }
    }

    .card-meta-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(7, 13, 30, 0.75);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 14px;
    }

    .meta-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meta-col-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .meta-col-val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-light);
    }

    .price-gold {
      color: var(--gold-primary);
      font-weight: 800;
    }

    .seats-highlight {
      color: #ffffff;
    }

    .seats-zero {
      color: #ef4444 !important;
    }

    /* 카드 하단 버튼 및 print 매핑 표시 */
    .card-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card-print-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }

    .print-tag {
      background: rgba(245, 208, 97, 0.1);
      border: 1px solid rgba(245, 208, 97, 0.25);
      color: var(--gold-primary);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .btn-card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: all 0.2s ease;
    }

    .btn-card-active {
      background: var(--gold-gradient);
      color: #070d1e;
      box-shadow: 0 4px 14px rgba(245, 208, 97, 0.35);
    }

    .btn-card-active:hover {
      background: var(--gold-gradient-hover);
      box-shadow: 0 6px 20px rgba(245, 208, 97, 0.5);
      transform: translateY(-1px);
    }

    .btn-card-disabled {
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #64748b;
      cursor: not-allowed;
    }

    .empty-cards-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-dim);
      border: 1px dashed var(--border-subtle);
      border-radius: 16px;
    }

    /* --------------------------------------------------
       RIGHT PANEL: 파이썬 코드 에디터
    -------------------------------------------------- */
    .code-editor-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .code-editor-window {
      background: var(--editor-bg);
      border: 1px solid var(--editor-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .editor-top-bar {
      background: #060a14;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .window-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .editor-tab-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .editor-body-wrap {
      display: flex;
      position: relative;
      min-height: 380px;
      max-height: 520px;
      background: var(--editor-bg);
    }

    .line-numbers {
      width: 48px;
      padding: 16px 8px;
      background: var(--editor-gutter);
      color: var(--editor-line-num);
      font-family: var(--font-mono);
      font-size: 0.92rem;
      line-height: 1.6;
      text-align: right;
      user-select: none;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      overflow-y: hidden;
    }

    .line-numbers span {
      display: block;
    }

    .code-textarea {
      flex: 1;
      padding: 16px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #e6edf3;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
      tab-size: 4;

    /* 툴바 */
    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-wrap: wrap;

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;

    .btn-tool {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .btn-apply {
      background: var(--gold-gradient);
      color: #070d1e;
      box-shadow: 0 4px 14px rgba(245, 208, 97, 0.35);
    }

    .btn-apply:hover {
      background: var(--gold-gradient-hover);
      box-shadow: 0 6px 20px rgba(245, 208, 97, 0.5);
      transform: translateY(-1px);
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-light);
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--gold-primary);

    }

    .btn-colab {
      background: rgba(46, 81, 162, 0.25);
      border: 1px solid rgba(46, 81, 162, 0.6);
      color: #93c5fd;
    }

    .btn-colab:hover {
      background: rgba(46, 81, 162, 0.45);

    /* 상태 안내 박스 */
    .py-status-box {
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 0.875rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.55;
      transition: all 0.3s ease;
    }

    .py-status-box.loading {
      background: rgba(46, 81, 162, 0.2);
      border: 1px solid rgba(46, 81, 162, 0.5);
      color: #93c5fd;
    }

    .py-status-box.success {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    .py-status-box.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .py-status-box.warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fcd34d;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-top: 2px;
      flex-shrink: 0;
    }

      to { transform: rotate(360deg); }
    }

    /* 모바일 반응형 */
    @media (max-width: 1024px) {
      .lab-layout {
        grid-template-columns: 1fr;
        padding: 16px;
      }
      .lab-top-banner {
        padding: 12px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .banner-right {
        align-self: flex-end;

      .card-footer-row {
        flex-direction: column;
        align-items: stretch;
      }
      .card-print-hint {
        max-width: 100%;
      }
      .btn-card-action {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- ==============================================
       TOP BANNER: 스킬투머니 실습실 · 5장
  =============================================== -->
  <header class="lab-top-banner" role="banner">

  <!-- ==============================================
       JAVASCRIPT: Pyodide 로딩, 파이썬 실행 & 카드 렌더링
  =============================================== -->
  <script>
    // 5장 기본 초기 파이썬 코드 (딕셔너리 리스트, len(), only_open 필터)
    const DEFAULT_PYTHON_CODE = `courses = [
    {"id": 1, "name": "AI 자동화", "price": 35000, "seat": 8, "booked": 8, "tags": ["초보 환영", "2시간"]},
    {"id": 2, "name": "숏폼 편집", "price": 45000, "seat": 6, "booked": 2, "tags": ["캡컷", "3시간"]},
    {"id": 3, "name": "엑셀 실무", "price": 30000, "seat": 10, "booked": 7, "tags": ["함수 실습"]},
    {"id": 4, "name": "스마트스토어", "price": 40000, "seat": 6, "booked": 5, "tags": ["상세페이지", "창업 준비"]}
]
only_open = True
for i in range(0, len(courses), 1):
    c = courses[i]
    left = c["seat"] - c["booked"]
    if only_open and left == 0:
        continue
    print(c["name"], c["price"], "원 / 남은 자리", left, "석", c["tags"])`;

    document.addEventListener('DOMContentLoaded', async function() {
      const codeEditor = document.getElementById('codeEditor');
      const lineNumbers = document.getElementById('lineNumbers');
      const btnResetToDefault = document.getElementById('btnResetToDefault');
      const btnApplyCode = document.getElementById('btnApplyCode');
      const btnRefreshList = document.getElementById('btnRefreshList');
      const btnDownloadColab = document.getElementById('btnDownloadColab');

      const chkOnlyOpen = document.getElementById('chkOnlyOpen');
      const filterStatusBadge = document.getElementById('filterStatusBadge');
      const pyStatusBox = document.getElementById('pyStatusBox');
      const pyStatusContent = document.getElementById('pyStatusContent');
      const pySpinner = document.getElementById('pySpinner');
      const cardsContainer = document.getElementById('cardsContainer');

      let pyodide = null;
      let isPyodideReady = false;

      // 초기 코드 설정
      codeEditor.value = DEFAULT_PYTHON_CODE;

      // --------------------------------------------------
      // 1. 줄 번호 동적 동기화 & Tab 키 4칸 들여쓰기
      // --------------------------------------------------
      function updateLineNumbers() {
        const lines = codeEditor.value.split('\n');
        lineNumbers.innerHTML = lines.map((_, i) => `<span>${i + 1}</span>`).join('');
      }

      codeEditor.addEventListener('input', updateLineNumbers);
      codeEditor.addEventListener('scroll', function() {
        lineNumbers.scrollTop = this.scrollTop;
      });

      codeEditor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = this.selectionStart;
          const end = this.selectionEnd;
          this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
          this.selectionStart = this.selectionEnd = start + 4;
          updateLineNumbers();
        }
      });

      updateLineNumbers();

      // --------------------------------------------------
      // 2. 상태 알림 헬퍼 함수
      // --------------------------------------------------
      function showSuccessNotice(msg) {
        pyStatusBox.className = 'py-status-box success';
        if (pySpinner) pySpinner.style.display = 'none';
        pyStatusContent.textContent = msg || "✔ 파이썬 코드가 웹앱에 적용되었습니다.";
      }

      function showErrorNotice(errMsg) {
        pyStatusBox.className = 'py-status-box error';
        if (pySpinner) pySpinner.style.display = 'none';
        pyStatusContent.textContent = errMsg;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // --------------------------------------------------
      // 3. 코랩 노트북 (.ipynb) 다운로드 (ch05_lab.ipynb)
      // --------------------------------------------------
      function downloadColabNotebook(codeText) {
        const notebookObj = {
          nbformat: 4,
          nbformat_minor: 0,
          metadata: {
            colab: { name: "ch05_lab.ipynb", provenance: [] },
            kernelspec: { name: "python3", display_name: "Python 3" },
            language_info: { name: "python" }
          },
          cells: [
            {
              cell_type: "markdown",
              metadata: {},
              source: [
                "# 스킬투머니 실습실 · 5장\n",
                "5장 실습실에서 작성한 딕셔너리 리스트와 len() 함수, 조건 필터링 코드입니다."
              ]
            },
            {
              cell_type: "code",
              metadata: {},
              execution_count: null,
              outputs: [],
              source: codeText.split('\n').map((line, idx, arr) => idx < arr.length - 1 ? line + '\n' : line)
            }
          ]
        };

        const blob = new Blob([JSON.stringify(notebookObj, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "ch05_lab.ipynb";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showSuccessNotice("✔ ch05_lab.ipynb를 내려받았습니다. 코랩 [파일] → [노트북 업로드]로 여세요.");
      }

      if (btnDownloadColab) {
        btnDownloadColab.addEventListener('click', function() {
          downloadColabNotebook(codeEditor.value);
        });
      }

      // [처음 코드로] 버튼 핸들러
      if (btnResetToDefault) {
        btnResetToDefault.addEventListener('click', function() {
          codeEditor.value = DEFAULT_PYTHON_CODE;
          updateLineNumbers();
          showSuccessNotice("✔ 처음 코드로 되돌리고 웹앱에 적용했습니다.");
          executePythonCode();
        });
      }

      // [웹앱에 적용] 및 [목록 새로 고침]
      if (btnApplyCode) {
        btnApplyCode.addEventListener('click', executePythonCode);
      }
      if (btnRefreshList) {
        btnRefreshList.addEventListener('click', function() {
          executePythonCode();
          showSuccessNotice("✔ 강좌 목록을 새로 고쳤습니다.");
        });
      }

      // --------------------------------------------------
      // 4. 파이썬 오류 파싱 및 한국어 안내
      // --------------------------------------------------
      function parsePythonError(errStr) {
        let lineNo = null;
        const lineMatch = errStr.match(/line\s+(\d+)/i);
        if (lineMatch) lineNo = lineMatch[1];
        const linePrefix = lineNo ? `${lineNo}번째 줄 ` : "";

        if (errStr.includes('SyntaxError')) {
          return { message: `${linePrefix}문법 오류: 따옴표, 괄호, 콜론(:) 또는 쉼표(,)가 빠지지 않았는지 확인하세요` };
        }
        if (errStr.includes('KeyError')) {
          return { message: `${linePrefix}키 오류: 딕셔너리에 존재하지 않는 키 이름(key)을 찾았습니다` };
        }
        if (errStr.includes('NameError')) {
          return { message: `${linePrefix}이름 오류: 변수나 리스트 이름의 철자가 맞는지 확인하세요` };
        }
        if (errStr.includes('TypeError')) {
          return { message: `${linePrefix}자료형 오류: 글자와 숫자를 잘못 계산하거나 엉뚱한 종류의 값을 넣지 않았는지 확인하세요` };
        }
        if (errStr.includes('IndexError')) {
          return { message: `${linePrefix}인덱스 오류: 리스트 범위를 벗어났습니다 (len() 범위 확인)` };
        }
        if (errStr.includes('IndentationError')) {
          return { message: `${linePrefix}들여쓰기 오류: for문 안쪽의 들여쓰기(띄어쓰기 4칸)가 맞는지 확인하세요` };
        }

        return { message: `${linePrefix}실행 오류: 코드를 다시 확인해 보세요` };
      }

      // --------------------------------------------------
      // 5. print() 한 줄 -> 강좌 카드 1장 파싱 및 렌더링
      //    print(c["name"], c["price"], "원 / 남은 자리", left, "석", c["tags"])
      // --------------------------------------------------
      function parseAndRenderPrintLines(printedLines) {
        if (!printedLines || printedLines.length === 0) {
          cardsContainer.innerHTML = `
            <div class="empty-cards-state">
              <p>표시할 강좌가 없습니다. (모든 강좌가 마감되었거나 print() 출력이 없습니다)</p>
            </div>
          `;
          return;
        }

        let cardsHtml = "";

        printedLines.forEach((rawLine, index) => {
          const line = rawLine.trim();
          if (!line) return;

          // 정규식 매칭: "AI 자동화 35000 원 / 남은 자리 0 석 ['초보 환영', '2시간']"
          const regexMatch = line.match(/^(.+?)\s+(\d+)\s*원\s*\/\s*남은\s*자리\s*(\d+)\s*석(?:\s*\[(.*?)\])?/);

          let courseName = "";
          let price = 0;
          let leftSeats = 0;
          let tags = [];

          if (regexMatch) {
            courseName = regexMatch[1].trim();
            price = parseInt(regexMatch[2], 10);
            leftSeats = parseInt(regexMatch[3], 10);
            if (regexMatch[4]) {
              tags = regexMatch[4]
                .split(",")
                .map(t => t.trim().replace(/^['"]|['"]$/g, ""))
                .filter(t => t.length > 0);
            }
          } else {
            // 유연한 fallback
            const tokens = line.split(/\s+/);
            courseName = tokens[0] || `강좌 #${index + 1}`;
            const nums = line.match(/\d+/g);
            if (nums && nums.length >= 2) {
              price = parseInt(nums[0], 10);
              leftSeats = parseInt(nums[1], 10);
            }
          }

          const isClosed = leftSeats === 0;
          const isUrgent = leftSeats === 1 || leftSeats === 2;

          // 아이콘 매칭
          let icon = "💡";
          if (courseName.includes("AI") || courseName.includes("자동화")) icon = "🤖";
          else if (courseName.includes("숏폼") || courseName.includes("영상") || courseName.includes("편집")) icon = "🎬";
          else if (courseName.includes("엑셀") || courseName.includes("실무")) icon = "📊";
          else if (courseName.includes("스마트스토어") || courseName.includes("스토어")) icon = "🛍️";

          // 상태 배지
          let badgeHtml = "";
          if (isClosed) {
            badgeHtml = `<span class="badge-closed">마감</span>`;
          } else if (isUrgent) {
            badgeHtml = `<span class="badge-urgent">마감 임박</span>`;
          }

          // 태그 배지 HTML
          let tagsHtml = "";
          if (tags && tags.length > 0) {
            tagsHtml = `
              <div class="card-tags-row">
                ${tags.map(t => `<span class="card-tag-badge">#${escapeHtml(t)}</span>`).join('')}
              </div>
            `;
          }

          // 버튼 HTML
          let buttonHtml = "";
          if (isClosed) {
            buttonHtml = `
              <button type="button" class="btn-card-action btn-card-disabled" disabled aria-disabled="true">
                <span>예약 마감</span>
              </button>
            `;
          } else {
            buttonHtml = `
              <button type="button" class="btn-card-action btn-card-active" onclick="alert('${escapeHtml(courseName)} (${price > 0 ? price.toLocaleString() + "원" : ""}) 예약 페이지로 이동합니다.')">
                <span>예약하기</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            `;
          }

          cardsHtml += `
            <div class="course-card-item ${isClosed ? 'is-closed' : ''}">
              <!-- 상단: 아이콘 + 굵은 강좌 이름 + 상태 배지 -->
              <div class="card-top-header">
                <div class="card-title-group">
                  <span class="card-icon">${icon}</span>
                  <strong class="card-course-name">${escapeHtml(courseName)}</strong>
                </div>
                <div>${badgeHtml}</div>
              </div>

              <!-- 강좌 이름 아래 작은 태그 배지 목록 -->
              ${tagsHtml}

              <!-- 중간 정보: 수강료 및 잔여석 -->
              <div class="card-meta-line">
                <div class="meta-col">
                  <span class="meta-col-label">수강료</span>
                  <span class="meta-col-val price-gold">${price > 0 ? price.toLocaleString() + "원" : "수강료 정보"}</span>
                </div>
                <div class="meta-col">
                  <span class="meta-col-label">남은 좌석</span>
                  <span class="meta-col-val ${isClosed ? 'seats-zero' : 'seats-highlight'}">
                    남은 자리 <strong>${leftSeats}석</strong>
                  </span>
                </div>
              </div>

              <!-- 하단: print 매핑 힌트 & 예약 버튼 -->
              <div class="card-footer-row">
                <div class="card-print-hint" title="${escapeHtml(line)}">
                  <span class="print-tag">출력</span>
                  <span>${escapeHtml(line)}</span>
                </div>
                ${buttonHtml}
              </div>
            </div>
          `;
        });

        cardsContainer.innerHTML = cardsHtml;
      }

      // --------------------------------------------------
      // 6. 파이썬 코드 실행 (Pyodide or Fallback 엔진)
      //    요구사항: 실행 후 only_open 변수 값에 따라 체크 상자 동기화
      // --------------------------------------------------
      async function executePythonCode() {
        const rawCode = codeEditor.value;
        let printedLines = [];
        let isOnlyOpen = true;

        if (isPyodideReady && pyodide) {
          try {
            window.__skill_print = function(line) {
              printedLines.push(String(line));
            };

            await pyodide.runPythonAsync(rawCode);

            // only_open 변수 값 추출
            try {
              const pyOnly = pyodide.globals.get('only_open');
              if (pyOnly !== undefined && pyOnly !== null) {
                isOnlyOpen = Boolean(pyOnly);
              }
            } catch(e) {}

            // 체크 상자 및 배지 동기화
            chkOnlyOpen.checked = isOnlyOpen;
            filterStatusBadge.textContent = isOnlyOpen ? "only_open = True" : "only_open = False";
            filterStatusBadge.style.color = isOnlyOpen ? "var(--gold-primary)" : "#94a3b8";

            parseAndRenderPrintLines(printedLines);
            showSuccessNotice(`✔ 파이썬 코드 실행 완료! (체크 상자: ${isOnlyOpen ? '체크됨' : '풀림'}, 총 ${printedLines.length}개 카드)`);
          } catch (pyErr) {
            const parsed = parsePythonError(String(pyErr));
            showErrorNotice(parsed.message);
          }
        } else {
          runFallbackPython(rawCode);
        }
      }

      // --------------------------------------------------
      // 7. 로컬 JS Fallback 엔진 (초기 화면 즉시 렌더링)
      // --------------------------------------------------
      function runFallbackPython(codeStr) {
        try {
          // only_open 변수 추출
          const mOnly = codeStr.match(/only_open\s*=\s*(True|False|1|0)/);
          const isOnlyOpen = mOnly ? (mOnly[1] === 'True' || mOnly[1] === '1') : true;

          // 체크 상자 동기화
          chkOnlyOpen.checked = isOnlyOpen;
          filterStatusBadge.textContent = isOnlyOpen ? "only_open = True" : "only_open = False";
          filterStatusBadge.style.color = isOnlyOpen ? "var(--gold-primary)" : "#94a3b8";

          // courses 리스트 영역 검사
          const coursesMatch = codeStr.match(/courses\s*=\s*\[([\s\S]*?)\]\s*(?:?
|$)/);
          let parsedCourses = [];

          if (coursesMatch) {
            const listContent = coursesMatch[1];

            // 쉼표 누락 문법 오류 검사 (딕셔너리 사이 쉼표 확인)
            const courseSplitRegex = /\}([\s\S]*?)\{/g;
            let sepMatch;
            while ((sepMatch = courseSplitRegex.exec(listContent)) !== null) {
              const between = sepMatch[1];
              if (!between.includes(',')) {
                const charIdx = codeStr.indexOf(listContent) + sepMatch.index + sepMatch[0].length - 1;
                const lineNo = codeStr.substring(0, charIdx).split(/?
/).length;
                showErrorNotice(`${lineNo}번째 줄 문법 오류: 따옴표, 괄호, 콜론(:) 또는 쉼표(,)가 빠지지 않았는지 확인하세요`);
                return;
              }
            }

            // 개별 딕셔너리 추출
            const dictRegex = /\{[^{}]*\}/g;
            let match;
            while ((match = dictRegex.exec(listContent)) !== null) {
              const dictStr = match[0];
              try {
                // 키 이름 따옴표 정규화 및 JSON 파싱
                let clean = dictStr.replace(/'/g, '"');
                clean = clean.replace(/([{,])\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*:/g, '$1"$2":');
                clean = clean.replace(/,\s*\}/g, '}');
                const item = JSON.parse(clean);
                parsedCourses.push(item);
              } catch (err) {
                const charIdx = codeStr.indexOf(listContent) + match.index;
                const lineNo = codeStr.substring(0, charIdx).split(/?
/).length;
                showErrorNotice(`${lineNo}번째 줄 문법 오류: 따옴표, 괄호, 콜론(:) 또는 쉼표(,)가 빠지지 않았는지 확인하세요`);
                return;
              }
            }
          }

          if (parsedCourses.length === 0) {
            parsedCourses = [
              { id: 1, name: "AI 자동화", price: 35000, seat: 8, booked: 8, tags: ["초보 환영", "2시간"] },
              { id: 2, name: "숏폼 편집", price: 45000, seat: 5, booked: 4, tags: ["캡컷", "3시간"] },
              { id: 3, name: "엑셀 실무", price: 30000, seat: 10, booked: 7, tags: ["함수 실습"] },
              { id: 4, name: "스마트스토어", price: 40000, seat: 6, booked: 5, tags: ["상세페이지", "창업 준비"] }
            ];
          }

          let lines = [];
          for (let i = 0; i < parsedCourses.length; i++) {
            const c = parsedCourses[i];
            const seat = Number(c.seat || 0);
            const booked = Number(c.booked || 0);
            const left = seat - booked;
            if (isOnlyOpen && left <= 0) {
              continue;
            }
            const tags = Array.isArray(c.tags) ? c.tags : [];
            const tagsStr = "['" + tags.join("', '") + "']";
            lines.push(`${c.name} ${c.price} 원 / 남은 자리 ${left} 석 ${tagsStr}`);
          }

          parseAndRenderPrintLines(lines);
          showSuccessNotice(`✔ 파이썬 코드 실행 완료! (체크 상자: ${isOnlyOpen ? '체크됨' : '풀림'}, 총 ${lines.length}개 카드)`);
        } catch (e) {
          showErrorNotice("실행 오류: 코드를 다시 확인해 보세요");
        }
      }

      // --------------------------------------------------
      // 8. Pyodide 비동기 초기화 및 첫 1회 실행
      // --------------------------------------------------
      async function initPyodide() {
        // 첫 화면 즉시 렌더링
        runFallbackPython(DEFAULT_PYTHON_CODE);

        try {
          if (typeof loadPyodide === 'function') {
            pyodide = await loadPyodide({
              indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
            });

            await pyodide.runPythonAsync(`
import js

def _custom_print(*args, **kwargs):
    sep = kwargs.get('sep', ' ')
    line = sep.join(str(a) for a in args)
    js.__skill_print(line)

__builtins__.print = _custom_print
`);

            isPyodideReady = true;
            executePythonCode();
          }
        } catch (err) {
          console.warn("Pyodide 로드 지연 또는 오프라인:", err);
          showSuccessNotice("✔ 브라우저 내장 파이썬 엔진 준비 완료");
        }
      }

      initPyodide();
    });
  </script>
